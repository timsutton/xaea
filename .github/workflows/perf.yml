name: Perf

# Manual benchmark of unaea against the real Xcode AEA fixture on a GitHub
# runner. Numbers from shared runners are noisy and Linux is not the
# speed-priority platform (macOS is), so treat them as a trend line and a
# regression tripwire, not as headline figures. The runner CPU model is
# printed in each job summary; compare runs only when it matches, and
# dispatch several runs to establish a baseline spread.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per benchmark (hyperfine --runs)
        default: "5"
      full_extract:
        description: Also benchmark a full on-disk extraction (needs ~11 GB free)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: Benchmark
    runs-on: ubuntu-latest
    env:
      AEA_FIXTURE: ${{ github.workspace }}/fixtures/Xcode_27.3_beta_2.aea
      AEA_FIXTURE_SHA256: 1d685d5c6b843a8ca46d34cf38134b72118af8caf28d9b5cfc0f91df4f2bfe64
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      # Same fixture handling as the `fixture` job in ci.yml: cache keyed on
      # the content hash, download from the secret URL only on a miss.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - name: Download fixture
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AEA_FIXTURE_URL: ${{ secrets.AEA_FIXTURE_URL }}
        run: |
          mkdir -p fixtures
          curl --fail --location --silent --show-error --retry 3 \
            --output "$AEA_FIXTURE" "$AEA_FIXTURE_URL"
      - name: Check fixture hash
        run: echo "$AEA_FIXTURE_SHA256  $AEA_FIXTURE" | sha256sum --check
      - name: Save fixture cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}

      - run: cargo build --release --locked

      - name: Runner info
        run: |
          nproc
          df -h "$RUNNER_TEMP" .

      # One warmup run primes the page cache so the timed runs measure the
      # pipeline rather than the first disk read; every run after that is
      # warm-cache, which matches how the README benchmarks are taken.
      - name: Benchmark (read-only paths)
        run: |
          mkdir -p perf
          U=target/release/unaea
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --export-json perf/readonly.json \
            -n "inspect --verify"          "$U inspect $AEA_FIXTURE --verify --json" \
            -n "extract --dry-run"         "$U extract $AEA_FIXTURE -o $RUNNER_TEMP/dry --dry-run --json" \
            -n "extract --dry-run --no-verify" "$U extract $AEA_FIXTURE -o $RUNNER_TEMP/dry --dry-run --no-verify --json" \
            --output null

      - name: Benchmark (full extract)
        if: inputs.full_extract
        run: |
          U=target/release/unaea
          OUT="$RUNNER_TEMP/out"
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --prepare "rm -rf $OUT" \
            --conclude "rm -rf $OUT" \
            --export-json perf/full.json \
            -n "extract (on disk)" "$U extract $AEA_FIXTURE -o $OUT --json" \
            --output null

      # Throughput = payload bytes / mean wall time. The byte count comes
      # from the tool's own --json summary so it tracks the fixture.
      - name: Summarize
        run: |
          BYTES=$(target/release/unaea extract "$AEA_FIXTURE" -o "$RUNNER_TEMP/dry" --dry-run --no-verify --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["bytes"])')
          python3 - "$BYTES" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json, os, sys
          nbytes = int(sys.argv[1])
          cpu = next((l.split(":", 1)[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")), "unknown CPU")
          print(f"## unaea perf: {cpu}, {os.cpu_count()} cores, {nbytes / 2**30:.2f} GiB payload\n")
          print("| benchmark | mean | ± σ | min | MiB/s (mean) |")
          print("|---|---:|---:|---:|---:|")
          for path in sorted(glob.glob("perf/*.json")):
              for r in json.load(open(path))["results"]:
                  mean = r["mean"]
                  mibs = nbytes / 2**20 / mean
                  print(f"| {r['command']} | {mean:.2f} s | {r['stddev']:.2f} | {r['min']:.2f} | {mibs:,.0f} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/*.json
