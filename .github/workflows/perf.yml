name: Perf

# Manual benchmark of xaea against the real Xcode AEA fixture on a GitHub
# macOS runner (macOS is the speed-priority platform). Numbers from shared
# runners are noisy, so treat them as a trend line and a regression
# tripwire, not as headline figures. The runner CPU model is
# printed in each job summary; compare runs only when it matches, and
# dispatch several runs to establish a baseline spread. The fleet really is
# mixed (Apple M1 and M2 Pro both show up), so the regression gate below is
# budgeted per CPU class rather than as one absolute number.

on:
  pull_request:
    # Only changes that can affect speed; docs/tests-only PRs skip this.
    paths: [src/**, Cargo.toml, Cargo.lock, .github/workflows/perf.yml]
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per benchmark (hyperfine --runs)
        default: "5"
      max_seconds:
        description: Override the time budget for mean `extract --dry-run` (seconds). Empty = the per-CPU budget table in the Enforce step.
        default: ""
      full_extract:
        description: Also benchmark a full on-disk extraction (needs ~11 GB free)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Same pinned compiler as ci.yml, so benchmarks stay comparable across runs
  # and across codegen changes from a Rust release. Renovate's github-actions
  # manager keeps the action digests current but does not see this value;
  # bump it by hand (or teach Renovate about it with a regex manager rule).
  RUST_VERSION: 1.100.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: Benchmark
    runs-on: macos-latest
    # Fork PRs can't read the fixture secret; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AEA_FIXTURE: ${{ github.workspace }}/fixtures/Xcode_27.3_beta_2.aea
      AEA_FIXTURE_SHA256: 1d685d5c6b843a8ca46d34cf38134b72118af8caf28d9b5cfc0f91df4f2bfe64
      RUNS: ${{ inputs.runs || '3' }}
      # Manual override only, and only ever from workflow_dispatch. The
      # effective budget is computed in the Enforce step from a single table
      # keyed on the runner CPU: there is no repo variable and no built-in
      # default here, so an empty override can never silently become the
      # limit.
      MAX_SECONDS_OVERRIDE: ${{ inputs.max_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          # Pinned: the --export-json schema changed in 2.0 (stats moved
          # under results[].summary), and the parsers below depend on it.
          tool: hyperfine@2.0.0

      # Same fixture handling as the `fixture` job in ci.yml: cache keyed on
      # the content hash, download from the secret URL only on a miss.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - name: Download fixture
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AEA_FIXTURE_URL: ${{ secrets.AEA_FIXTURE_URL }}
        run: |
          mkdir -p fixtures
          curl --fail --location --silent --show-error --retry 3 \
            --output "$AEA_FIXTURE" "$AEA_FIXTURE_URL"
      - name: Check fixture hash
        run: echo "$AEA_FIXTURE_SHA256  $AEA_FIXTURE" | shasum -a 256 --check
      - name: Save fixture cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}

      - run: cargo build --release --locked

      - name: Runner info
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          df -h "$RUNNER_TEMP" .

      # One warmup run primes the page cache so the timed runs measure the
      # pipeline rather than the first disk read; every run after that is
      # warm-cache, which matches how the README benchmarks are taken.
      - name: Benchmark (read-only paths)
        run: |
          mkdir -p perf
          U=target/release/xaea
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --export-json perf/readonly.json \
            -n "inspect --verify"          "$U inspect $AEA_FIXTURE --verify --json" \
            -n "extract --dry-run"         "$U extract $AEA_FIXTURE $RUNNER_TEMP/dry --dry-run --json" \
            -n "extract --dry-run --no-verify" "$U extract $AEA_FIXTURE $RUNNER_TEMP/dry --dry-run --no-verify --json" \
            --output null

      - name: Benchmark (full extract)
        if: inputs.full_extract
        run: |
          U=target/release/xaea
          OUT="$RUNNER_TEMP/out"
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --prepare "rm -rf $OUT" \
            --conclude "rm -rf $OUT" \
            --export-json perf/full.json \
            -n "extract (on disk, compressed: the macOS default)" "$U extract $AEA_FIXTURE $OUT --json" \
            -n "extract --no-compress (on disk)" "$U extract $AEA_FIXTURE $OUT --no-compress --json" \
            --output null

      # Throughput = payload bytes / mean wall time. The byte count and the
      # thread counts come from the tool's own --json summary, so the numbers
      # carry the decoder/writer config they were measured with.
      - name: Summarize
        run: |
          SUMMARY=$(target/release/xaea extract "$AEA_FIXTURE" "$RUNNER_TEMP/dry" --dry-run --no-verify --json)
          python3 - "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json, os, subprocess, sys
          info = json.loads(sys.argv[1])
          nbytes = info["bytes"]
          cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"], capture_output=True, text=True).stdout.strip() or "unknown CPU"
          print(f"## xaea perf: {cpu}, {os.cpu_count()} cores, {nbytes / 2**30:.2f} GiB payload")
          print(f"\nThreads: {info['decoders']} decoders, {info['writers']} writers (defaults; decoders = cores-1, min 2)\n")
          print("| benchmark | mean | ± σ | min | MiB/s (mean) |")
          print("|---|---:|---:|---:|---:|")
          for path in sorted(glob.glob("perf/*.json")):
              for r in json.load(open(path))["results"]:
                  t = r["summary"]["time_wall_clock"]
                  mibs = nbytes / 2**20 / t["mean"]
                  print(f"| {r['name']} | {t['mean']:.2f} s | {t['stddev'] or 0:.2f} | {t['min']:.2f} | {mibs:,.0f} |")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: perf-results
          path: perf/*.json

      # Last, so the summary and artifact are published even when it fails.
      - name: Enforce time limit
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          # The one place a time budget is written down. Keyed on the runner
          # CPU because macos-latest is a mixed fleet: on the same commit an
          # Apple M2 Pro measured 19.3-20.5 s and an Apple M1 42.6-58.1 s for
          # this benchmark, so a single absolute number is either theater on
          # the fast class or a flake on the slow one. Each entry is ~1.25x
          # that class's median and ~1.10x its worst observed run. Re-derive
          # from CI history: doc/PERFORMANCE-NOTES.md, "The CI time limit".
          BUDGET_S = {"Apple M1": 64, "Apple M2 Pro": 28}

          raw = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"],
                               capture_output=True, text=True).stdout.strip()
          # GitHub's macOS runners report the chip plus a virtualisation
          # suffix — the real string is "Apple M1 (Virtual)", not "Apple M1".
          # Key the table on the chip so it matches hosted and bare-metal
          # runners alike; the unknown-CPU warning quotes the raw string.
          cpu = re.sub(r"\s*\(.*\)\s*$", "", raw)
          override = os.environ.get("MAX_SECONDS_OVERRIDE", "").strip()
          if override:
              try:
                  limit, why = float(override), "workflow_dispatch override"
              except ValueError:
                  print(f"::error title=Bad input::max_seconds {override!r} is not a number")
                  sys.exit(1)
          elif cpu in BUDGET_S:
              limit, why = float(BUDGET_S[cpu]), f"budget for {cpu}"
          else:
              # Unknown class (GitHub rotated the fleet): keep the loosest
              # known budget rather than guess, and say so loudly.
              limit = float(max(BUDGET_S.values()))
              why = f"unrecognised runner CPU {raw!r}, loosest known budget applied"
              print(f"::warning title=Unknown runner CPU::{why} — add {cpu!r} to BUDGET_S "
                    f"in .github/workflows/perf.yml so this class is actually gated")

          rs = {r["name"]: r for r in json.load(open("perf/readonly.json"))["results"]}
          mean = rs["extract --dry-run"]["summary"]["time_wall_clock"]["mean"]
          print(f"extract --dry-run mean {mean:.2f}s on {cpu} (limit {limit:g}s — {why})")
          if mean > limit:
              print(f"::error title=Perf regression::extract --dry-run took {mean:.1f}s on average on {cpu}, over the {limit:g}s budget")
              sys.exit(1)
          PY
