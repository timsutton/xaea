name: Perf

# Manual benchmark of xaea against the real Xcode AEA fixture on a GitHub
# macOS runner (macOS is the speed-priority platform). Numbers from shared
# runners are noisy, so treat them as a trend line and a regression
# tripwire, not as headline figures. The runner CPU model is
# printed in each job summary; compare runs only when it matches, and
# dispatch several runs to establish a baseline spread.
#
# The workflow also runs on every push to main that touches perf-relevant
# files, and each such run appends a small JSON record of its results to a
# `perf-history` Actions cache. PR runs restore that history and derive the
# regression gate from it — 1.35x the mean of the last five main runs on the
# same CPU model — instead of relying on a static limit that drifts out of
# date (see issue #40). The margin covers runner noise: in a backtest over
# historical M1-class runs the worst single-run ratio against a five-run
# mean was 1.25, for 0 false flags in 34 gate decisions.
# A dispatch `max_seconds` input overrides the derived gate; the
# PERF_MAX_SECONDS repo variable (currently 70) is the fallback until
# enough same-CPU main runs have accumulated.

on:
  push:
    branches: [main]
    # Same filter as pull requests: docs/tests-only commits don't move the
    # numbers, so don't spend macOS minutes or dilute the baseline on them.
    paths: [src/**, Cargo.toml, Cargo.lock, .github/workflows/perf.yml]
  pull_request:
    # Only changes that can affect speed; docs/tests-only PRs skip this.
    paths: [src/**, Cargo.toml, Cargo.lock, .github/workflows/perf.yml]
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per benchmark (hyperfine --runs)
        default: "5"
      max_seconds:
        description: 'Fail if mean `extract --dry-run` exceeds this (overrides the gate derived from recent main runs; default: derived, else repo variable PERF_MAX_SECONDS, else 120)'
        default: ""
      full_extract:
        description: Also benchmark a full on-disk extraction (needs ~11 GB free)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Same pinned compiler as ci.yml, so benchmarks stay comparable across runs
  # and across codegen changes from a Rust release. Renovate's github-actions
  # manager keeps the action digests current but does not see this value;
  # bump it by hand (or teach Renovate about it with a regex manager rule).
  RUST_VERSION: 1.100.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: Benchmark
    runs-on: macos-latest
    # Fork PRs can't read the fixture secret; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AEA_FIXTURE: ${{ github.workspace }}/fixtures/Xcode_27.3_beta_2.aea
      AEA_FIXTURE_SHA256: 1d685d5c6b843a8ca46d34cf38134b72118af8caf28d9b5cfc0f91df4f2bfe64
      RUNS: ${{ inputs.runs || '3' }}
      # Regression gate. Derived from recent main runs on the same CPU (see
      # "Enforce time limit"); this input overrides that. PERF_MAX_SECONDS is
      # only the fallback while the main-run history is still thin.
      MAX_SECONDS: ${{ inputs.max_seconds }}
      PERF_MAX_SECONDS: ${{ vars.PERF_MAX_SECONDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          # Pinned: the --export-json schema changed in 2.0 (stats moved
          # under results[].summary), and the parsers below depend on it.
          tool: hyperfine@2.0.0

      # Same fixture handling as the `fixture` job in ci.yml: cache keyed on
      # the content hash, download from the secret URL only on a miss.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - name: Download fixture
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AEA_FIXTURE_URL: ${{ secrets.AEA_FIXTURE_URL }}
        run: |
          mkdir -p fixtures
          curl --fail --location --silent --show-error --retry 3 \
            --output "$AEA_FIXTURE" "$AEA_FIXTURE_URL"
      - name: Check fixture hash
        run: echo "$AEA_FIXTURE_SHA256  $AEA_FIXTURE" | shasum -a 256 --check
      - name: Save fixture cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}

      - run: cargo build --release --locked

      - name: Runner info
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu
          df -h "$RUNNER_TEMP" .

      # Baseline history for the regression gate: one JSON line per main run.
      # Cache keys are immutable, so restore via the `perf-history-` prefix
      # (the exact key, carrying this run's ID, can never hit) and re-save
      # under a fresh key after appending. Caches created on main are
      # restorable from PR runs, which is the whole point here.
      - name: Restore perf history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: perf-history/history.jsonl
          key: perf-history-${{ github.run_id }}
          restore-keys: perf-history-

      # One warmup run primes the page cache so the timed runs measure the
      # pipeline rather than the first disk read; every run after that is
      # warm-cache, which matches how the README benchmarks are taken.
      - name: Benchmark (read-only paths)
        run: |
          mkdir -p perf
          U=target/release/xaea
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --export-json perf/readonly.json \
            -n "inspect --verify"          "$U inspect $AEA_FIXTURE --verify --json" \
            -n "extract --dry-run"         "$U extract $AEA_FIXTURE $RUNNER_TEMP/dry --dry-run --json" \
            -n "extract --dry-run --no-verify" "$U extract $AEA_FIXTURE $RUNNER_TEMP/dry --dry-run --no-verify --json" \
            --output null

      - name: Benchmark (full extract)
        if: inputs.full_extract
        run: |
          U=target/release/xaea
          OUT="$RUNNER_TEMP/out"
          hyperfine -N --warmup 1 --runs "$RUNS" \
            --prepare "rm -rf $OUT" \
            --conclude "rm -rf $OUT" \
            --export-json perf/full.json \
            -n "extract (on disk, compressed: the macOS default)" "$U extract $AEA_FIXTURE $OUT --json" \
            -n "extract --no-compress (on disk)" "$U extract $AEA_FIXTURE $OUT --no-compress --json" \
            --output null

      # Throughput = payload bytes / mean wall time. The byte count and the
      # thread counts come from the tool's own --json summary, so the numbers
      # carry the decoder/writer config they were measured with.
      - name: Summarize
        run: |
          SUMMARY=$(target/release/xaea extract "$AEA_FIXTURE" "$RUNNER_TEMP/dry" --dry-run --no-verify --json)
          python3 - "$SUMMARY" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json, os, subprocess, sys
          info = json.loads(sys.argv[1])
          nbytes = info["bytes"]
          cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"], capture_output=True, text=True).stdout.strip() or "unknown CPU"
          print(f"## xaea perf: {cpu}, {os.cpu_count()} cores, {nbytes / 2**30:.2f} GiB payload")
          print(f"\nThreads: {info['decoders']} decoders, {info['writers']} writers (defaults; decoders = cores-1, min 2)\n")
          print("| benchmark | mean | ± σ | min | MiB/s (mean) |")
          print("|---|---:|---:|---:|---:|")
          for path in sorted(glob.glob("perf/*.json")):
              for r in json.load(open(path))["results"]:
                  t = r["summary"]["time_wall_clock"]
                  mibs = nbytes / 2**20 / t["mean"]
                  print(f"| {r['name']} | {t['mean']:.2f} s | {t['stddev'] or 0:.2f} | {t['min']:.2f} | {mibs:,.0f} |")
          PY

      # Main pushes are the baseline source; PR and dispatch runs never write
      # history, so branch-specific or ad-hoc timings can't pollute the gate.
      - name: Append to perf history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p perf-history
          python3 - <<'PY'
          import datetime, glob, json, os, subprocess
          path = "perf-history/history.jsonl"
          records = []
          if os.path.exists(path):
              with open(path) as f:
                  records = [json.loads(line) for line in f if line.strip()]
          cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"],
                               capture_output=True, text=True).stdout.strip() or "unknown CPU"
          record = {
              "run": os.environ["GITHUB_RUN_ID"],
              "ts": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "sha": os.environ["GITHUB_SHA"][:10],
              "cpu": cpu,
              "benchmarks": {
                  r["name"]: round(r["summary"]["time_wall_clock"]["mean"], 3)
                  for p in sorted(glob.glob("perf/*.json"))
                  for r in json.load(open(p))["results"]
              },
          }
          # Keep a bounded tail; the gate only reads the last few per CPU.
          records = (records + [record])[-200:]
          with open(path, "w") as f:
              for rec in records:
                  f.write(json.dumps(rec) + "\n")
          print(f"history now {len(records)} records")
          PY
      - name: Save perf history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: perf-history/history.jsonl
          key: perf-history-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: perf-results
          path: perf/*.json

      # Last, so the summary and artifact are published even when it fails.
      # The gate is relative: MARGIN times the mean of the last WINDOW main
      # runs on the same CPU model, so it tracks the code and runner fleet
      # instead of drifting out of date. The margin covers runner noise: the
      # worst single-run ratio against a five-run mean was 1.25, flagging 0
      # of 34 gate decisions in a backtest over historical M1-class runs. A
      # dispatch max_seconds input still forces a fixed limit;
      # PERF_MAX_SECONDS (currently 70) holds until enough same-CPU
      # baselines exist.
      - name: Enforce time limit
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          WINDOW, MARGIN, MIN_BASELINES, FALLBACK = 5, 1.35, 3, 120.0

          rs = {r["name"]: r for r in json.load(open("perf/readonly.json"))["results"]}
          mean = rs["extract --dry-run"]["summary"]["time_wall_clock"]["mean"]

          override = (os.environ.get("MAX_SECONDS") or "").strip()
          if override:
              limit, basis = float(override), "dispatch override"
          else:
              cpu = subprocess.run(["sysctl", "-n", "machdep.cpu.brand_string"],
                                   capture_output=True, text=True).stdout.strip()
              history = []
              if os.path.exists("perf-history/history.jsonl"):
                  with open("perf-history/history.jsonl") as f:
                      history = [json.loads(line) for line in f if line.strip()]
              # Same-CPU main runs only, excluding this run if it is one.
              baselines = [
                  r["benchmarks"]["extract --dry-run"]
                  for r in history
                  if r.get("cpu") == cpu
                  and str(r.get("run")) != os.environ.get("GITHUB_RUN_ID", "")
                  and "extract --dry-run" in r.get("benchmarks", {})
              ]
              if len(baselines) >= MIN_BASELINES:
                  window = baselines[-WINDOW:]
                  baseline = sum(window) / len(window)
                  limit = baseline * MARGIN
                  basis = (f"{MARGIN:g}x mean of last {len(window)} main runs "
                           f"on {cpu} ({baseline:.1f}s)")
              else:
                  fallback = (os.environ.get("PERF_MAX_SECONDS") or "").strip()
                  limit = float(fallback) if fallback else FALLBACK
                  basis = (f"static fallback (only {len(baselines)} same-CPU "
                           f"baselines)")
          print(f"extract --dry-run mean {mean:.2f}s (limit {limit:.1f}s: {basis})")
          if mean > limit:
              print(f"::error title=Perf regression::extract --dry-run took "
                    f"{mean:.1f}s on average, over the {limit:.1f}s limit "
                    f"derived from {basis}")
              sys.exit(1)
          PY
