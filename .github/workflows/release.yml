name: Release

# Publishes a GitHub Release with prebuilt macOS and Linux binaries
# (macOS as one universal binary; Linux x86_64 / aarch64). The macOS binary is
# Developer ID-signed and notarized (see `notarize` in .goreleaser.yaml;
# secrets listed below). Everything builds on one macOS runner: the
# darwin targets natively, the Linux ones zig-cross-linked.
#
# To cut a release: bump `version` in Cargo.toml, commit, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`. The workflow refuses to publish
# unless the tag matches the version in Cargo.toml and Cargo.lock.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Dry run — build every asset, publish nothing"
        type: boolean
        default: false

# Don't cancel an in-flight release; don't run two at once either.
concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always
  # Published binaries are built with the same pinned compiler as CI, so a
  # released asset can be rebuilt bit-for-bit later. Keep in step with ci.yml.
  RUST_VERSION: 1.100.0
  # Minimum macOS the darwin binaries support (rustc, cc and the SDK all honour
  # it). Pinned so a toolchain bump can't silently raise it; keep in step with
  # ci.yml, whose macos-minos job asserts it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  release:
    name: Build & publish
    # macOS targets build natively with cargo (Apple SDK, both archs); the
    # Linux assets are zig-cross-linked from this runner via cargo-zigbuild.
    runs-on: macos-latest
    permissions:
      contents: write # goreleaser creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history — GoReleaser generates the release notes from the
          # commit log between tags.
          fetch-depth: 0
      # A real release must be cut from a vX.Y.Z tag that matches the crate
      # version in both Cargo.toml and Cargo.lock; otherwise the binaries would
      # report a different version than the release they're attached to.
      # Dry runs (snapshot) skip this.
      - name: Verify tag matches crate version
        if: ${{ !inputs.snapshot }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Non-dry-run releases must run from a tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          toml_version=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          lock_version=$(awk -F'"' '/^name = "xaea"$/ {getline; print $2; exit}' Cargo.lock)
          echo "tag=$tag_version Cargo.toml=$toml_version Cargo.lock=$lock_version"
          if [ "$tag_version" != "$toml_version" ] || [ "$tag_version" != "$lock_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match Cargo.toml ($toml_version) / Cargo.lock ($lock_version)"
            exit 1
          fi
      # Signing/notarizing is skipped by GoReleaser when the certificate secret
      # is absent, so a real release must fail here rather than quietly publish
      # unsigned binaries. Needs: MACOS_SIGN_P12 (base64 Developer ID
      # Application .p12), MACOS_SIGN_PASSWORD, MACOS_NOTARY_ISSUER_ID,
      # MACOS_NOTARY_KEY_ID, MACOS_NOTARY_KEY (base64 App Store Connect .p8).
      - name: Require macOS signing secrets
        if: ${{ !inputs.snapshot }}
        run: |
          for v in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set; refusing to publish unsigned macOS binaries"
              exit 1
            fi
          done
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # Both Apple targets (the runner is arm64) plus the Linux ones.
          targets: x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Zig supplies the linker that cargo-zigbuild drives for aarch64.
      # Pinned as an action rather than a curl'd tarball so Renovate's
      # github-actions manager tracks the ref and digest; the Zig release is
      # the `version` input below.
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      # Without cosign on PATH, goreleaser-action only checks the downloaded
      # archive against the published checksums.txt; with it, the action also
      # verifies that file's sigstore signature against GoReleaser's own
      # release-workflow OIDC identity (cosign v3 bundle format, so the pinned
      # goreleaser below must stay ≥ v2.13.0 — v2.20.2 does). Verification
      # happens inside the action; no signature of *our* artifacts is involved.
      # https://github.com/goreleaser/goreleaser-action#verification
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: ${{ inputs.snapshot && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # Check what actually shipped in the darwin archive: Developer ID-signed
      # with the hardened runtime. Notarization can't be checked offline;
      # GoReleaser waits for Apple's verdict and fails the step on rejection.
      # The script is a no-op when signing is off (no MACOS_SIGN_P12).
      - name: Verify macOS signatures
        run: scripts/verify-macos-signature.sh dist
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
