name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the compiler across every workflow. Pinned so
  # fmt/clippy/test results don't shift under CI when Rust releases; bump
  # deliberately alongside `rust-version` in Cargo.toml. Renovate tracks the
  # action digest here, not this value — see the note in perf.yml.
  RUST_VERSION: 1.100.0
  # Minimum macOS the darwin binaries support; keep in step with release.yml.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The synthetic-AEA tests skip when python3/`cryptography` is missing,
    # which would silently un-test the corrupt-signature rejection paths.
    # Require them here so a skip fails the job instead of going green.
    env:
      AEA_REQUIRE_SYNTHETIC: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The real Xcode fixture isn't in the repo, so the tests that need it
      # are #[ignore]d and stay skipped here. See README for running them
      # locally with AEA_FIXTURE=… cargo test -- --ignored.
      # The synthetic-AEA builder (scripts/make_test_aea.py) needs python3 and
      # `cryptography`. Both images carry it today, but a missing one must not
      # let the suite skip itself into green, so install it on the off chance.
      # The tests run python3 with `-I`, which implies `-s` (no user
      # site-packages) and `-E` (no PYTHONPATH), so neither a `--user` install
      # nor a PYTHONPATH export is visible to them. A venv's own site-packages
      # is located from the interpreter path, so it survives `-I`: build a venv
      # and put it first on PATH. uv rather than pip — neither runner image
      # ships it, so it comes from the action, pinned by digest like the others
      # in this workflow.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Ensure python `cryptography` for the synthetic AEA builder
        run: |
          if python3 -I -c "import cryptography" 2>/dev/null; then
            echo "cryptography already importable; no venv needed"
            exit 0
          fi
          # Absolute path, so uv builds the venv on the runner's own python3
          # instead of fetching a managed interpreter.
          uv venv --python "$(command -v python3)" "$RUNNER_TEMP/aea-python"
          uv pip install --python "$RUNNER_TEMP/aea-python/bin/python3" cryptography
          # GITHUB_PATH only applies to later steps, so verify here with the
          # venv interpreter directly, using the same `-I` probe the tests
          # make — this step must not be able to pass while the tests still
          # cannot import the package.
          "$RUNNER_TEMP/aea-python/bin/python3" -I -c "import cryptography"
          echo "$RUNNER_TEMP/aea-python/bin" >> "$GITHUB_PATH"
      - run: cargo test --locked

  macos-minos:
    name: macOS deployment target
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
      - run: |
          scripts/check-minos.sh "$MACOSX_DEPLOYMENT_TARGET" \
            target/x86_64-apple-darwin/release/xaea \
            target/aarch64-apple-darwin/release/xaea

  fixture:
    name: Real fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The fixture URL lives in an Actions secret, which fork PRs (and
    # Dependabot) can't read; skip the job there instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AEA_FIXTURE: ${{ github.workspace }}/fixtures/Xcode_27.3_beta_2.aea
      AEA_FIXTURE_SHA256: 1d685d5c6b843a8ca46d34cf38134b72118af8caf28d9b5cfc0f91df4f2bfe64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Keyed on the content hash, so the URL is only hit on a cache miss.
      # Saved right after the hash check (not at job end) so a failing test
      # doesn't throw away a good download.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - name: Download fixture
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AEA_FIXTURE_URL: ${{ secrets.AEA_FIXTURE_URL }}
        run: |
          mkdir -p fixtures
          # --silent keeps the URL out of progress output; the secret is also
          # masked in logs by Actions.
          curl --fail --location --silent --show-error --retry 3 \
            --output "$AEA_FIXTURE" "$AEA_FIXTURE_URL"
      - name: Check fixture hash
        run: echo "$AEA_FIXTURE_SHA256  $AEA_FIXTURE" | shasum -a 256 --check
      - name: Save fixture cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - run: cargo test --release --locked -- --ignored --nocapture fixture

  # cargo audit deferred to a follow-up PR: decide policy for the two
  # verify-only-inapplicable timing advisories (rsa RUSTSEC-2023-0071,
  # crypto-bigint RUSTSEC-2026-0387) — see git history on this branch for
  # the .cargo/audit.toml approach that was prototyped here.
