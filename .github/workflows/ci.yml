name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Single source of truth for the compiler across every workflow. Pinned so
  # fmt/clippy/test results don't shift under CI when Rust releases; bump
  # deliberately alongside `rust-version` in Cargo.toml. Renovate tracks the
  # action digest here, not this value — see the note in perf.yml.
  RUST_VERSION: 1.100.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The real Xcode fixture isn't in the repo, so the tests that need it
      # are #[ignore]d and stay skipped here. See README for running them
      # locally with AEA_FIXTURE=… cargo test -- --ignored.
      - run: cargo test --locked

  bazel:
    name: Bazel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Bazel repository downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/bazel-repository-cache
          key: bazel-repository-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'Cargo.lock', 'scripts/bazel-test-requirements.lock') }}
          restore-keys: bazel-repository-${{ runner.os }}-${{ runner.arch }}-
      - run: bazelisk build --config=ci --repository_cache="$RUNNER_TEMP/bazel-repository-cache" //:xaea
      - run: bazelisk test --config=ci --repository_cache="$RUNNER_TEMP/bazel-repository-cache" --test_output=errors //:tests

  linux-docker:
    name: Linux Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Builds scripts/linux.Dockerfile and runs a container from it. The grep
      # fails the job if its Rust version falls behind RUST_VERSION.
      - run: scripts/linux.sh rustc --version | grep -F "rustc $RUST_VERSION "

  fixture:
    name: Real fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The fixture URL lives in an Actions secret, which fork PRs (and
    # Dependabot) can't read; skip the job there instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AEA_FIXTURE: ${{ github.workspace }}/fixtures/Xcode_27.3_beta_2.aea
      AEA_FIXTURE_SHA256: 1d685d5c6b843a8ca46d34cf38134b72118af8caf28d9b5cfc0f91df4f2bfe64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Keyed on the content hash, so the URL is only hit on a cache miss.
      # Saved right after the hash check (not at job end) so a failing test
      # doesn't throw away a good download.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - name: Download fixture
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AEA_FIXTURE_URL: ${{ secrets.AEA_FIXTURE_URL }}
        run: |
          mkdir -p fixtures
          # --silent keeps the URL out of progress output; the secret is also
          # masked in logs by Actions.
          curl --fail --location --silent --show-error --retry 3 \
            --output "$AEA_FIXTURE" "$AEA_FIXTURE_URL"
      - name: Check fixture hash
        run: echo "$AEA_FIXTURE_SHA256  $AEA_FIXTURE" | shasum -a 256 --check
      - name: Save fixture cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: fixtures/Xcode_27.3_beta_2.aea
          key: aea-fixture-${{ env.AEA_FIXTURE_SHA256 }}
      - run: cargo test --release --locked -- --ignored --nocapture fixture

  # cargo audit deferred to a follow-up PR: decide policy for the two
  # verify-only-inapplicable timing advisories (rsa RUSTSEC-2023-0071,
  # crypto-bigint RUSTSEC-2026-0387) — see git history on this branch for
  # the .cargo/audit.toml approach that was prototyped here.
