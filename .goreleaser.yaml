# GoReleaser configuration — https://goreleaser.com
#
# Driven by .github/workflows/release.yml, which runs on every `v*` tag push:
# bump the version in Cargo.toml, tag it, and the release publishes itself.

version: 2

builds:
  # Run on a macOS runner. The darwin targets use plain `cargo build` (the
  # Apple SDK handles both architectures natively); zigbuild is for the
  # Linux targets only, giving a consistent glibc floor (2.30, measured).
  - id: darwin
    builder: rust
    binary: xaea
    command: build
    flags:
      - --release
      - --locked
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
  - id: linux
    builder: rust
    binary: xaea
    command: zigbuild
    flags:
      - --release
      - --locked
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - # Default name template (xaea_<version>_<os>_<arch>.tar.gz); ship the
    # license and top-level docs alongside the binary.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
