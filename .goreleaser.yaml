# GoReleaser configuration — https://goreleaser.com
#
# Driven by .github/workflows/release.yml, which runs on every `v*` tag push:
# bump the version in Cargo.toml, tag it, and the release publishes itself.

version: 2

builds:
  # Run on a macOS runner. The darwin targets use plain `cargo build` (the
  # Apple SDK handles both architectures natively) and are merged into one
  # universal binary by `universal_binaries` below; zigbuild is for the
  # Linux targets only, giving a consistent glibc floor (2.30, measured).
  - id: darwin
    builder: rust
    binary: xaea
    command: build
    flags:
      - --release
      - --locked
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
  - id: linux
    builder: rust
    binary: xaea
    command: zigbuild
    flags:
      - --release
      - --locked
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

# Merge the two darwin builds with lipo into a single fat binary, published as
# xaea_<version>_darwin_universal.tar.gz in place of the per-arch darwin archives.
universal_binaries:
  - id: darwin-universal # notarize selects the merged binary by this id
    ids: [darwin]
    replace: true

# Sign + notarize the darwin binaries (Developer ID, hardened runtime) via
# quill, built into GoReleaser OSS — no codesign/xcrun needed. Runs after the
# build (and any universal-binary merge) and before archiving, so the signed
# binary is what lands in the tarball. A bare Mach-O can't be stapled;
# Gatekeeper looks the ticket up online on first run of a quarantined copy.
# Skipped when MACOS_SIGN_P12 is unset (snapshots, forks); release.yml
# refuses to publish a real release without the secrets.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - darwin-universal
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}" # base64 .p12
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}" # base64 .p8
        wait: true
        timeout: 20m

# The release body comes from CHANGELOG.md (release.yml passes it with
# --release-notes), so don't generate a commit-log changelog.
changelog:
  disable: true

archives:
  - # Default name template (xaea_<version>_<os>_<arch>.tar.gz) except that the
    # lipo-merged macOS binary is "universal" rather than GoReleaser's "all".
    # Ship the license and top-level docs alongside the binary.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
