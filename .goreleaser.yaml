# GoReleaser configuration — https://goreleaser.com
#
# Driven by .github/workflows/release.yml, which runs on every `v*` tag push:
# bump the version in Cargo.toml, tag it, and the release publishes itself.

version: 2

builds:
  - builder: rust
    binary: xaea
    flags:
      - --release
      - --locked
    targets:
      # Linux only for now — a darwin asset needs a macOS runner, which
      # GitHub doesn't offer for private repos (see PR notes). The rust
      # builder drives `cargo zigbuild` by default and runs `rustup target
      # add` per target: x86_64 builds natively, aarch64 is cross-linked
      # with zig, so both build on one ubuntu runner with a consistent
      # glibc floor (2.30, measured).
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

archives:
  - # Default name template (xaea_<version>_<os>_<arch>.tar.gz); ship the
    # license and top-level docs alongside the binary.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# Publishes a formula to the timsutton/homebrew-formulae repo on each release
# (`brew install timsutton/formulae/xaea`). Needs the HOMEBREW_TAP_TOKEN secret —
# the workflow's GITHUB_TOKEN can't push to a different repository. Skipped
# automatically for snapshot (dry-run) builds.
#
# `brews` is deprecated in GoReleaser in favour of `homebrew_casks`, but casks
# are macOS-only, so formulae remain the way to ship Linux binaries. Linux-only
# for now, matching the archives above; add a macOS target to
# `builds` and the formula picks it up with no change here.
brews:
  - name: xaea
    repository:
      owner: timsutton
      name: homebrew-formulae
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/timsutton/xaea
    description: Fast extractor for Apple Encrypted Archives (AEA) — Xcode edition
    license: MIT
    commit_author:
      name: Timothy Sutton
      email: tim@synthist.net
    test: |
      assert_match version.to_s, shell_output("#{bin}/xaea --version")
