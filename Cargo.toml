[package]
name = "unaea"
version = "0.1.0"
edition = "2021"
# trim_ascii (sigverify PEM handling)
rust-version = "1.80"
description = "Fast extractor for Apple Encrypted Archives (AEA) — Xcode edition"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x509-parser = "0.17"
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
libc = "0.2"
xz2 = { version = "0.1.7", features = ["static"] }
signature = "3"
ecdsa = "0.17"
rsa = { version = "0.9", features = ["sha2"] }
serde_json = "1"

[profile.release]
lto = true
