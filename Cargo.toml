[package]
name = "unaea"
version = "0.1.0"
edition = "2021"
description = "Fast extractor for Apple Encrypted Archives (AEA) — Xcode edition"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x509-parser = "0.17"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
xz2 = { version = "0.1.7", features = ["static"] }
signature = "2"
ecdsa = { version = "0.16", features = ["verifying"] }
rsa = { version = "0.9", features = ["sha2", "sha1"] }
serde_json = "1"

[profile.release]
lto = true
