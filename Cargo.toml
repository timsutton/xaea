[package]
name = "xaea"
version = "0.1.3"
edition = "2024"
# RustCrypto floor: rsa 0.10 / crypto-bigint >=0.7.6 (the patched versions for
# RUSTSEC-2023-0071 / RUSTSEC-2026-0387) both declare 1.87.
rust-version = "1.87"
description = "Fast extractor for Apple Encrypted Archives (AEA) — Xcode edition"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
x509-parser = "0.18"
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
libc = "0.2"
# Vendored xz-utils (5.8.x), statically linked; we call the one-shot
# lzma_stream_buffer_decode directly. From the liblzma crate family, the
# maintained successor of xz2/lzma-sys (whose xz 5.2.5 decoded ~23% slower).
liblzma-sys = { version = "0.4", features = ["static"] }
signature = "3"
ecdsa = "0.17"
# Verify-only: std + DER encoding + pkcs1v15 (digests come from our own sha2;
# 0.10 dropped the old `sha2` alias feature). No getrandom/signing path.
rsa = { version = "0.10", default-features = false, features = [
    "std", "encoding", "pkcs1v15",
] }
serde_json = "1"
tempfile = "3"

[features]
# Pipeline timing probes (XAEA_STATS breakdown, XAEA_TL timeline, XAEA_DQ/XAEA_WQ
# queue overrides). Compiles to nothing when off; see src/prof.rs.
profile = []

[dev-dependencies]
# Unit tests only: builds .xz streams to feed the decoder.
liblzma = { version = "0.4", features = ["static"] }

[profile.release]
lto = true

# CI runs clippy with -D warnings, so these are enforced. A deliberately
# small subset of clippy::pedantic: the lints that catch real problems in
# this codebase, not the cast-precision noise of byte-offset arithmetic.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
format_collect = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"
