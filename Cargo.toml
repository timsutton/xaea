[package]
name = "xaea"
version = "0.2.1"
edition = "2024"
# Set by lzma-turbo 0.12 (the default decoder), which declares 1.97.1. The
# code itself needs only let-chains (1.88), and the locked sha2 0.11 and time
# 0.3 declare 1.88 too. (The RustCrypto security floor, rsa 0.10 /
# crypto-bigint >=0.7.6 for RUSTSEC-2023-0071 / RUSTSEC-2026-0387, is 1.87.)
rust-version = "1.97.1"
description = "Fast extractor for Apple Encrypted Archives (AEA) — Xcode edition"
license = "MIT"

[dependencies]
anyhow = "1"
# `wrap_help`: wrap help at the terminal width, indented under the help text.
clap = { version = "4", features = ["derive", "wrap_help"] }
# `xaea completions <shell>`: AOT generators only (default features), so the
# dependency is clap itself plus the script templates. Normal dep, not a
# feature: releases ship a bare binary, and completions must be generatable
# from the shipped binary without a feature-flagged rebuild from source.
clap_complete = "4"
memmap2 = "0.9"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
x509-parser = "0.18"
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa"] }
libc = "0.2"
# Vendored xz-utils (5.8.x), statically linked, behind `--decoder liblzma`; we
# call the one-shot lzma_stream_buffer_decode directly. From the liblzma crate family, the
# maintained successor of xz2/lzma-sys (whose xz 5.2.5 decoded ~23% slower).
liblzma-sys = { version = "0.4", features = ["static"] }
# Pure-Rust port of 7-Zip's LZMA decoder, the default segment decoder. Only the
# .xz decoder: no encoder, and SHA-256 xz checks through our own sha2
# (`native-crypto`) rather than the default AWS-LC C library.
lzma-turbo = { version = "0.12", default-features = false, features = ["std", "asm", "xz", "native-crypto"] }
signature = "3"
ecdsa = "0.17"
# Verify-only: std + DER encoding + pkcs1v15 (digests come from our own sha2;
# 0.10 dropped the old `sha2` alias feature). No getrandom/signing path.
rsa = { version = "0.10", default-features = false, features = [
    "std", "encoding", "pkcs1v15",
] }
serde_json = "1"
tempfile = "3"
# AES-256-CTR: the cipher of encrypting (profile 1) archives.
aes = "0.9"
ctr = "0.10"
# AES-256-GCM for the HPKE key unwrap of restore-image (WKMS) archives.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Restore images over the network (`decrypt <ipsw-url>`, and fetching an
# archive's key from its key URL): a small blocking client, rustls with
# bundled Mozilla roots (no OpenSSL), no gzip (range reads want raw bytes).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# IPSWs are zips: DEFLATE for BuildManifest.plist, the plist to name each
# disk image's role.
flate2 = "1"
plist = { version = "1", default-features = false }

# LZFSE segments (restore images): pure Rust off macOS; macOS uses the
# OS's libcompression, which decodes them faster.
[target.'cfg(not(target_os = "macos"))'.dependencies]
lzfse_rust = "0.2"

[features]
# Pipeline timing probes (XAEA_STATS breakdown, XAEA_TL timeline, XAEA_DQ/XAEA_WQ
# queue overrides). Compiles to nothing when off; see src/prof.rs.
profile = []

[dev-dependencies]
# Unit tests only: builds .xz streams to feed the decoder.
liblzma = { version = "0.4", features = ["static"] }
# Unit tests only: builds LZFSE segments to feed the decoder.
lzfse_rust = "0.2"

[profile.release]
lto = true

# CI runs clippy with -D warnings, so these are enforced. A deliberately
# small subset of clippy::pedantic: the lints that catch real problems in
# this codebase, not the cast-precision noise of byte-offset arithmetic.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
borrow_as_ptr = "warn"
cast_lossless = "warn"
format_collect = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"
